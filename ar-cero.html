<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
        <meta name="theme-color" content="#26292E" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2738%27 fill=%27none%27 stroke=%27%23B84335%27 stroke-width=%278%27/%3E%3C/svg%3E" />
        <title>San Sebastián · Realidad aumentada</title>

        <!-- This product includes the XR Engine software developed by Niantic Spatial, Inc.
             Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
             Licensed under the XR Engine License Agreement: https://github.com/8thwall/engine/blob/main/LICENSE
             Provided "AS IS", without warranties (see the disclaimer in the License). -->
        <!-- el motor web (./external/xr/xr.js) se carga desde src/ar-cero.ts solo cuando hace falta -->


    </head>
    <body>
        <canvas id="application-canvas"></canvas>

        <div id="top">
            <a id="back" href="./"></a>
            <span></span>
            <div id="top-right">
                <div id="lang" role="group" aria-label="Language / Idioma">
                    <button type="button" data-lang="en">EN</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" data-lang="es">ES</button>
                </div>
                <a href="https://wa.me/593992730095" target="_blank" rel="noopener" aria-label="WhatsApp"><img class="logo" src="./logo.png" alt="" /></a>
            </div>
        </div>

        <!-- título: siempre visible (inicio y cámara) -->
        <header id="masthead">
            <p id="mast-kicker"></p>
            <h1 id="mast-title"></h1>
        </header>

        <section id="start" tabindex="0">
            <h2 id="kicker"></h2>
            <p id="intro"></p>
            <ol id="steps"></ol>
            <p id="install-note" class="note" hidden></p>
            <button type="button" id="start-btn"></button>
        </section>

        <!-- todo lo que va encima de la cámara (en AR nativa es el overlay DOM de WebXR) -->
        <div id="ui">
            <img id="logo-ar" class="logo" src="./logo.png" alt="" hidden />
            <!-- aviso de carga, en el centro: siempre a la vista mientras algo carga -->
            <div id="loading" role="status" aria-live="polite" hidden>
                <p id="loading-text"></p>
                <div id="loading-bar"><div id="loading-fill"></div></div>
                <p id="loading-pct"></p>
            </div>
            <p id="hint" hidden></p>
            <button type="button" id="again" hidden></button>
            <p id="status" hidden></p>
        </div>

        <script type="module" src="/src/ar-cero.ts"></script>
    </body>
</html>
