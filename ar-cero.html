<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
        <meta name="theme-color" content="#3b3a35" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2738%27 fill=%27none%27 stroke=%27%23a6473e%27 stroke-width=%278%27/%3E%3C/svg%3E" />
        <title>San Sebastián · Realidad aumentada</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Libre+Franklin:wght@600&display=swap"
        />

        <!-- This product includes the XR Engine software developed by Niantic Spatial, Inc.
             Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
             Licensed under the XR Engine License Agreement: https://github.com/8thwall/engine/blob/main/LICENSE
             Provided "AS IS", without warranties (see the disclaimer in the License). -->
        <script async src="./external/xr/xr.js" data-preload-chunks="slam"></script>

        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #141311;
                font: 15px/1.4 system-ui, sans-serif;
                color: #fff;
                -webkit-tap-highlight-color: transparent;
            }
            #application-canvas {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
            }
            #top {
                position: fixed;
                left: 12px;
                right: 12px;
                top: calc(10px + env(safe-area-inset-top));
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 20;
            }
            #top a {
                position: fixed;
                left: 22px;
                bottom: calc(22px + env(safe-area-inset-bottom));
                color: #e7d8d6;
                text-decoration: none;
                font-size: 15px;
            }
            #masthead {
                position: fixed;
                top: max(18px, env(safe-area-inset-top));
                left: 22px;
                z-index: 30;
                pointer-events: none;
                text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 1px 12px rgba(0, 0, 0, 0.85);
            }
            #masthead p {
                margin: 0;
            }
            #mast-kicker {
                margin-bottom: 2px !important;
                font: 600 12px 'Libre Franklin', system-ui, sans-serif;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: #a6473e;
            }
            #mast-title {
                font: 500 clamp(1.7rem, 7vw, 2.6rem) / 1 'Cormorant Garamond', Georgia, serif;
                letter-spacing: 0.01em;
                color: #e7d8d6;
            }
            #lang button {
                background: none;
                border: 0;
                color: #9a908e;
                font: 600 14px system-ui, sans-serif;
                padding: 6px 4px;
            }
            #lang button.on {
                color: #fff;
            }
            #lang span {
                color: #6b6361;
            }
            #start {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 24px;
                text-align: center;
                background: #111 url('./src/assets/pattern.svg') repeat;
                background-size: 52px 90px;
                z-index: 10;
            }
            #start h1 {
                margin: 0;
                font-size: 24px;
            }
            #start p,
            #start ol {
                margin: 0;
                max-width: 340px;
                font-size: 16px;
                color: #ddd;
            }
            #start ol {
                text-align: left;
                padding-left: 22px;
                line-height: 1.6;
            }
            #start .note {
                font-size: 14px;
                color: #aaa;
            }
            #start-btn {
                margin-top: 6px;
                padding: 8px 2px 6px;
                font: 600 24px system-ui, sans-serif;
                color: #fff;
                background: none;
                border: 0;
                border-bottom: 2px solid #a6473e;
            }
            #ui {
                position: fixed;
                inset: 0;
                z-index: 5;
                touch-action: none;
            }
            #hint {
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: calc(20px + env(safe-area-inset-bottom));
                margin: 0;
                padding: 0 8px;
                font-size: 17px;
                text-align: center;
                text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 1px 12px rgba(0, 0, 0, 0.85);
                pointer-events: none;
            }
            #hint b {
                font-size: 19px;
            }
            #again {
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                bottom: calc(130px + env(safe-area-inset-bottom));
                height: 44px;
                padding: 0 12px;
                font: 600 15px system-ui, sans-serif;
                color: #fff;
                background: none;
                border: 0;
                text-decoration: underline;
                text-underline-offset: 4px;
                text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 1px 12px rgba(0, 0, 0, 0.85);
            }
            #status {
                position: fixed;
                left: 8px;
                top: calc(8px + env(safe-area-inset-top));
                margin: 0;
                padding: 4px 8px;
                font: 12px ui-monospace, monospace;
                text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
                pointer-events: none;
            }
            #top-right {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .logo {
                height: 38px;
                width: auto;
                pointer-events: none;
                filter: drop-shadow(0 1px 6px rgba(0, 0, 0, 0.6));
            }
            #logo-ar {
                position: fixed;
                top: calc(10px + env(safe-area-inset-top));
                right: 12px;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>

        <div id="top">
            <a id="back" href="./"></a>
            <span></span>
            <div id="top-right">
                <div id="lang" role="group" aria-label="Language / Idioma">
                    <button type="button" data-lang="en">EN</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" data-lang="es">ES</button>
                </div>
                <img class="logo" src="./logo.png" alt="" />
            </div>
        </div>

        <!-- título: siempre visible (inicio y cámara) -->
        <header id="masthead">
            <p id="mast-kicker"></p>
            <p id="mast-title"></p>
        </header>

        <section id="start">
            <h1 id="kicker"></h1>
            <p id="intro"></p>
            <ol id="steps"></ol>
            <p id="install-note" class="note" hidden></p>
            <button type="button" id="start-btn"></button>
        </section>

        <!-- todo lo que va encima de la cámara (en AR nativa es el overlay DOM de WebXR) -->
        <div id="ui">
            <img id="logo-ar" class="logo" src="./logo.png" alt="" hidden />
            <p id="hint" hidden></p>
            <button type="button" id="again" hidden></button>
            <p id="status" hidden></p>
        </div>

        <script type="module" src="/src/ar-cero.ts"></script>
    </body>
</html>
