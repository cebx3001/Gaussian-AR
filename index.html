<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0d0d0d" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2738%27 fill=%27none%27 stroke=%27%23b84335%27 stroke-width=%278%27/%3E%3C/svg%3E" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Syne:wght@700;800&display=swap" />
        <title>San Sebastián · Cuenca</title>

    <body class="locked">
        <div id="stage"></div>
        <div id="veil"></div>

        <div id="archive-header" aria-hidden="true">
            <span><i></i> ECUADOR // 07.9</span>
            <span>CUENCA.ARCH</span>
        </div>

        <div id="top-nav-icons" aria-hidden="true">
            <span>‹</span>
            <span>···</span>
        </div>

        <div id="section-row">
            <span id="section-title">CUENCA · PATRIMONIO</span>
            <div id="lang" role="group" aria-label="Language / Idioma">
                <button type="button" data-lang="en">EN</button>
                <span aria-hidden="true">/</span>
                <button type="button" data-lang="es">ES</button>
            </div>
        </div>

        <a id="logo-link" href="https://wa.me/593992730095" target="_blank" rel="noopener" aria-label="WhatsApp"><img id="logo" src="./logo.png" alt="" /></a>

        <nav id="top-links">
            <a id="ar-link" href="ar-cero.html" hidden></a>
        </nav>

        <header id="masthead">
            <p id="masthead-kicker"></p>
            <h1 id="masthead-title"></h1>
        </header>

        <div id="ar-meta">
            <span class="ar-icon" aria-hidden="true"></span>
            <span id="ar-label"></span>
            <span class="ar-id">ID: 1578-SEC</span>
        </div>

        <div id="archive-divider"></div>

        <main id="scroller">
            <div id="story"></div>
        </main>

        <div id="scroll-cue" aria-hidden="true">
            <svg viewBox="0 0 24 36" width="22" height="33">
                <rect x="1.5" y="1.5" width="21" height="33" rx="10.5" fill="none" stroke="currentColor" stroke-width="2" />
                <circle class="wheel" cx="12" cy="10" r="2.6" fill="currentColor" />
            </svg>
            <span class="chev"></span>
            <span id="scroll-cue-text"></span>
        </div>

        <div id="how" role="note" hidden></div>
        <button type="button" id="back-story" hidden></button>
        <nav id="index" aria-label="Lugares"></nav>
        <button type="button" id="fab-button" aria-label="Explorar libremente"><span aria-hidden="true">✦</span></button>

        <div id="loader" role="status" aria-live="polite">
            <p id="loader-kicker"></p>
            <p id="loader-title">San Sebastián</p>
            <div id="loader-bar"><div id="loader-fill"></div></div>
            <p id="loader-message"></p>
        </div>

        <script>
            (function () {
                var l = new URLSearchParams(location.search).get('lang');
                try { if (l !== 'es' && l !== 'en') l = localStorage.getItem('san-sebastian:lang'); } catch (e) {}
                if (l !== 'es' && l !== 'en') l = (navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
                var t = l === 'es' ? ['Cuenca · Patrimonio', 'Cargando la plaza'] : ['Cuenca · Heritage', 'Loading the square'];
                document.documentElement.lang = l;
                document.getElementById('loader-kicker').textContent = t[0];
                document.getElementById('loader-message').textContent = t[1];
            })();
        </script>
        <script type="module" src="/src/historia.ts"></script>
    </body>
</html>
