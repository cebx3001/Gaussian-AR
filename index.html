<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0d0f0e" />
        <title>Plaza de San Sebastián · Cuenca</title>
    </head>
    <body>
        <canvas id="view"></canvas>

        <header id="brand">
            <p id="brand-kicker"></p>
            <h1 id="brand-title"></h1>
        </header>

        <a id="ar-link" href="ar.html" hidden>Ver en AR</a>

        <section id="panel" hidden>
            <p id="panel-kicker"></p>
            <h2 id="panel-title"></h2>
            <p id="panel-text"></p>
            <div id="panel-nav">
                <button type="button" id="prev" aria-label="Punto anterior">&larr;</button>
                <span id="panel-count"></span>
                <button type="button" id="next" aria-label="Punto siguiente">&rarr;</button>
            </div>
        </section>

        <nav id="stops" aria-label="Puntos de la plaza"></nav>

        <aside id="editor" hidden>
            <button type="button" id="ed-toggle">Modo edición &#9662;</button>
            <div id="ed-body">
                <label>Punto <select id="ed-select"></select></label>
                <label>Etiqueta <input id="ed-kicker" type="text" /></label>
                <label>Título <input id="ed-title" type="text" /></label>
                <label>Texto <textarea id="ed-text" rows="5"></textarea></label>
                <div class="ed-row">
                    <button type="button" id="ed-capture">Capturar pose aquí</button>
                    <button type="button" id="ed-go">Ir a la pose</button>
                </div>
                <div class="ed-row">
                    <button type="button" id="ed-copy">Copiar datos</button>
                    <button type="button" id="ed-reset">Descartar cambios</button>
                </div>
                <p id="ed-status"></p>
                <textarea id="ed-export" rows="6" readonly hidden></textarea>
            </div>
        </aside>

        <div id="loader" role="status" aria-live="polite">
            <p id="loader-message">Cargando la plaza…</p>
            <div id="loader-bar"><div id="loader-fill"></div></div>
        </div>

        <script type="module" src="/src/viewer-main.ts"></script>
    </body>
</html>
