<!doctype html>
<html lang="es" data-scene="el-vado">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#26292E" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2738%27 fill=%27none%27 stroke=%27%23B84335%27 stroke-width=%278%27/%3E%3C/svg%3E" />
        <title>El Vado · Cuenca</title>
    </head>
    <body class="locked">
        <div id="stage"></div>
        <div id="story-filter" aria-hidden="true"></div>
        <!-- Contrato de la capa de lectura; el contraste se resuelve en la tipografía. -->
        <div id="veil"></div>

        <a id="logo-link" href="https://wa.me/593992730095" target="_blank" rel="noopener" aria-label="WhatsApp"><img id="logo" src="./logo.png" alt="" /></a>

        <div id="lang" role="group" aria-label="Language / Idioma">
            <button type="button" data-lang="en">EN</button>
            <span aria-hidden="true">|</span>
            <button type="button" data-lang="es">ES</button>
        </div>

        <!-- debajo del título: realidad aumentada (solo en teléfonos) -->
        <nav id="top-links">
            <a id="ar-link" href="ar-cero.html?scene=el-vado" hidden></a>
            <div id="mode-switch" role="group" aria-label="Modo / Mode">
                <button type="button" id="story-mode" aria-pressed="true" disabled></button>
                <button type="button" id="tour-mode" aria-pressed="false" disabled></button>
            </div>
        </nav>

        <header id="masthead">
            <p id="chapter-position" aria-hidden="true"></p>
            <p id="masthead-kicker"></p>
            <h1 id="masthead-title"></h1>
        </header>

        <!-- la historia: el scroll de esta capa mueve la cámara (src/historia.ts) -->
        <main id="scroller" tabindex="0" aria-label="Historia / Story">
            <div id="story"></div>
        </main>
        <section id="tour-caption" tabindex="0" aria-label="Lugar / Place" hidden></section>

        <!-- aviso de scroll: aparece al terminar la entrada y se va al empezar a bajar -->
        <div id="scroll-cue" aria-hidden="true">
            <span class="chev"></span>
            <span id="scroll-cue-text"></span>
        </div>
        <!-- instrucciones de «Explorar libremente» -->
        <div id="how" role="note" hidden></div>
        <button type="button" id="back-story" hidden></button>

        <nav id="index" aria-label="Lugares"></nav>

        <!-- Control temporal: retirar cuando se elija la opacidad definitiva. -->


        <div id="loader" role="status" aria-live="polite">
            <p id="loader-kicker"></p>
            <p id="loader-title">El Vado</p>
            <div id="loader-bar"><div id="loader-fill"></div></div>
            <p id="loader-message"></p>
        </div>

        <script>
            // idioma de la pantalla de carga, antes de que cargue el resto del código
            (function () {
                var l = new URLSearchParams(location.search).get('lang');
                try { if (l !== 'es' && l !== 'en') l = localStorage.getItem('el-vado:lang'); } catch (e) {}
                if (l !== 'es' && l !== 'en') l = (navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
                var t = l === 'es' ? ['Cuenca · Patrimonio', 'Cargando El Vado'] : ['Cuenca · Heritage', 'Loading El Vado'];
                document.documentElement.lang = l;
                document.getElementById('loader-kicker').textContent = t[0];
                document.getElementById('loader-message').textContent = t[1];
            })();
        </script>
        <script type="module" src="/src/vado-entry.ts"></script>
    </body>
</html>
